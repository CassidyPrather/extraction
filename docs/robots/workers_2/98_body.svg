<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" font-family="DejaVu Sans, sans-serif">
  <rect width="1400" height="760" fill="#e9ebee"/>
  <text x="30" y="44" font-size="28" font-weight="bold" fill="#222">#98 body mock: the engineer and what it builds</text>
  <text x="30" y="74" font-size="16" fill="#444">Robot bodies. Replaces the minelayer. Unarmed, helpless alone: a kit bundle on its back, a lamp it scans with. Build stages read at a glance.</text>

  <!-- Panel A: engineer -->
  <g transform="translate(40,110)">
    <rect width="380" height="600" fill="#f7f8f9" stroke="#bbb"/>
    <text x="16" y="30" font-size="18" font-weight="bold" fill="#333">A. The engineer, side on</text>
    <!-- body: low long hull on six short legs -->
    <rect x="90" y="300" width="200" height="80" rx="18" fill="#c7b089" stroke="#222" stroke-width="3"/>
    <g stroke="#333" stroke-width="5" fill="none">
      <path d="M 110 380 L 96 420 L 104 450"/>
      <path d="M 160 380 L 150 420 L 158 450"/>
      <path d="M 220 380 L 230 420 L 222 450"/>
      <path d="M 270 380 L 284 420 L 276 450"/>
    </g>
    <!-- kit bundle -->
    <rect x="130" y="220" width="120" height="80" rx="6" fill="#6b7a4a" stroke="#222" stroke-width="3"/>
    <line x1="130" y1="250" x2="250" y2="250" stroke="#3a3d41" stroke-width="4"/>
    <rect x="150" y="200" width="16" height="30" fill="#9aa0a6" stroke="#222"/>
    <rect x="180" y="196" width="10" height="34" fill="#9aa0a6" stroke="#222"/>
    <rect x="206" y="204" width="24" height="26" fill="#9aa0a6" stroke="#222"/>
    <text x="200" y="166" font-size="13" fill="#333">kit bundle: struts, panels,</text>
    <text x="200" y="182" font-size="13" fill="#333">camera, cable</text>
    <!-- scan lamp on a short arm -->
    <line x1="290" y1="320" x2="320" y2="300" stroke="#333" stroke-width="5"/>
    <rect x="316" y="288" width="22" height="22" rx="4" fill="#3a3d41" stroke="#e8562a" stroke-width="3"/>
    <polygon points="338,299 380,270 380,330" fill="#ffffff" opacity="0.6"/>
    <text x="200" y="472" font-size="13" fill="#333">scan lamp: orange-red rim</text>
    <!-- eye -->
    <rect x="80" y="320" width="14" height="20" rx="3" fill="#c92a1e"/>
    <text x="30" y="500" font-size="15" fill="#222">Pale, workaday paint (not armour grey):</text>
    <text x="30" y="525" font-size="15" fill="#222">a worker, not a fighter. No gun.</text>
    <text x="30" y="550" font-size="15" fill="#222">Weak points: the kit (it drops), the lamp.</text>
  </g>

  <!-- Panel B: barricade stages -->
  <g transform="translate(440,110)">
    <rect width="440" height="600" fill="#f7f8f9" stroke="#bbb"/>
    <text x="16" y="30" font-size="18" font-weight="bold" fill="#333">B. Barricade: struts, then panels and strap</text>
    <g transform="translate(30,90)">
      <text x="0" y="0" font-size="14" fill="#333">1. struts</text>
      <line x1="20" y1="130" x2="60" y2="30" stroke="#8a6a3a" stroke-width="8"/>
      <line x1="100" y1="130" x2="140" y2="30" stroke="#8a6a3a" stroke-width="8"/>
      <line x1="180" y1="130" x2="220" y2="30" stroke="#8a6a3a" stroke-width="8"/>
      <line x1="0" y1="132" x2="380" y2="132" stroke="#6b5b45" stroke-width="3"/>
    </g>
    <g transform="translate(30,300)">
      <text x="0" y="0" font-size="14" fill="#333">2. panels and a strap: done (cover, it stops rounds)</text>
      <line x1="20" y1="130" x2="60" y2="30" stroke="#8a6a3a" stroke-width="8"/>
      <line x1="100" y1="130" x2="140" y2="30" stroke="#8a6a3a" stroke-width="8"/>
      <line x1="180" y1="130" x2="220" y2="30" stroke="#8a6a3a" stroke-width="8"/>
      <polygon points="10,128 50,32 150,32 110,128" fill="#7d8287" stroke="#222" stroke-width="2"/>
      <polygon points="110,128 150,32 250,32 210,128" fill="#868b90" stroke="#222" stroke-width="2"/>
      <line x1="20" y1="80" x2="240" y2="80" stroke="#e8562a" stroke-width="5"/>
      <text x="260" y="85" font-size="13" fill="#333">orange strap: cut it</text>
      <text x="260" y="103" font-size="13" fill="#333">and the panels drop</text>
      <line x1="0" y1="132" x2="380" y2="132" stroke="#6b5b45" stroke-width="3"/>
    </g>
  </g>

  <!-- Panel C: camera stages -->
  <g transform="translate(900,110)">
    <rect width="460" height="600" fill="#f7f8f9" stroke="#bbb"/>
    <text x="16" y="30" font-size="18" font-weight="bold" fill="#333">C. Camera: mast, lens and cone, cable</text>
    <g transform="translate(40,80)">
      <text x="0" y="0" font-size="14" fill="#333">1. mast</text>
      <line x1="40" y1="200" x2="40" y2="30" stroke="#5d6166" stroke-width="7"/>
      <line x1="0" y1="200" x2="120" y2="200" stroke="#6b5b45" stroke-width="3"/>
    </g>
    <g transform="translate(200,80)">
      <text x="0" y="0" font-size="14" fill="#333">2. lens, its cone lit</text>
      <line x1="40" y1="200" x2="40" y2="30" stroke="#5d6166" stroke-width="7"/>
      <rect x="28" y="20" width="34" height="22" rx="4" fill="#3a3d41" stroke="#e8562a" stroke-width="3"/>
      <polygon points="62,31 220,0 220,90" fill="#ffffff" opacity="0.45" stroke="#e8562a" stroke-dasharray="6 6"/>
      <line x1="0" y1="200" x2="200" y2="200" stroke="#6b5b45" stroke-width="3"/>
    </g>
    <g transform="translate(40,340)">
      <text x="0" y="0" font-size="14" fill="#333">3. cable to the network (a relay pylon's, as now)</text>
      <line x1="40" y1="200" x2="40" y2="30" stroke="#5d6166" stroke-width="7"/>
      <rect x="28" y="20" width="34" height="22" rx="4" fill="#3a3d41" stroke="#e8562a" stroke-width="3"/>
      <path d="M 40 200 Q 140 230 300 200 L 300 120" fill="none" stroke="#222" stroke-width="3"/>
      <rect x="284" y="80" width="34" height="44" fill="#d0d3d6" stroke="#222" stroke-width="2"/>
      <text x="230" y="70" font-size="13" fill="#333">pylon (yours, unchanged)</text>
      <text x="80" y="250" font-size="13" fill="#333">cut the cable: the camera goes dark</text>
      <line x1="0" y1="200" x2="380" y2="200" stroke="#6b5b45" stroke-width="3"/>
    </g>
  </g>
</svg>
