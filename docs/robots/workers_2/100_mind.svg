<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="sans-serif" font-size="12"><rect width="480" height="300" fill="#f6f4ee"/>
<text x="12" y="20" font-weight="bold">#100 Legless grappler: anchor to anchor</text>
<rect x="20" y="230" width="440" height="50" fill="#cdbb99"/>
<rect x="200" y="150" width="70" height="80" fill="#aaa"/><text x="205" y="195">house</text>
<line x1="70" y1="230" x2="70" y2="110" stroke="#694" stroke-width="5"/><text x="40" y="105">tree</text>
<line x1="400" y1="230" x2="400" y2="100" stroke="#666" stroke-width="4"/><text x="380" y="95">pole</text>
<circle cx="70" cy="125" r="8" fill="#555"/>
<path d="M70 125 Q235 30 400 115" fill="none" stroke="#c33" stroke-dasharray="6 4"/><text x="170" y="60" fill="#c33">arcing shot over the roof (0.6 s wind-up)</text>
<line x1="400" y1="115" x2="330" y2="230" stroke="#7a5"/><rect x="320" y="225" width="18" height="12" fill="#a63"/><text x="300" y="255">crate hauled to the pod</text>
<text x="12" y="290" fill="#444">Cut its line mid-swing and it falls and is stunned. A hook on your gun starts a tug-of-war you can win.</text>
</svg>
