name: CI/CD

on:
  push:
    # Development branches get the same checks as main.
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml links with clang + mold on Linux; the runners
  # install both (below) so CI builds the same way as local ones.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System dependencies
        # Bevy needs udev, ALSA, X11/Wayland headers to link; the headless
        # scenarios need none of the runtime libraries.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev clang mold

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (default lints, warnings allowed)
        # Deliberately not -D warnings: see docs/DESIGN.md, "Lints".
        run: cargo clippy --workspace --all-targets

      - name: Unit tests
        run: cargo test --workspace

      - name: Bot scenarios (headless integration tests)
        run: cargo run --release -- --headless --scenario all

  package:
    needs: check
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev clang mold

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The textures are fetched and processed at build time (they're not
      # in git); the audio is committed, already mastered. Without numpy and
      # Pillow the fetch failed at import and builds shipped without any
      # textures, so a failed fetch now fails the package.
      - name: Fetch CC0 textures
        shell: bash
        run: |
          python -m pip install --quiet numpy pillow
          python scripts/fetch_assets.py
          test -f assets/textures/terrain/albedo.ktx2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          BIN="extraction"
          OUT="dist/extraction-${{ matrix.target }}"
          mkdir -p "$OUT"
          cp -r assets "$OUT/assets"
          rm -rf "$OUT/assets/.cache"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/${BIN}.exe" "$OUT/"
            7z a "dist/extraction-${{ matrix.target }}.zip" "./$OUT/*"
          else
            cp "target/${{ matrix.target }}/release/${BIN}" "$OUT/"
            tar -czf "dist/extraction-${{ matrix.target }}.tar.gz" -C dist "extraction-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: extraction-${{ matrix.target }}
          path: dist/extraction-${{ matrix.target }}.*

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/extraction-${{ matrix.target }}.*
          fail_on_unmatched_files: true
