name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Install native audio dependencies
        # macroquad's `audio` feature pulls in quad-alsa-sys, which links
        # -lasound. The runner image ships libasound.so.2 but not the .so
        # symlink the linker needs, so native builds fail without this.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        # No args: installs the version, components and targets pinned in
        # rust-toolchain.toml, so CI and local builds use the same compiler
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Lint with clippy (wasm)
        # No --all-targets: benches and tests only build natively
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: |
          # Just warnings for now...
          cargo audit || true

  build-web:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for attaching the web zip to releases
    env:
      # Optimized-wasm ceiling. Tune per toy; the point is noticing when the payload jumps.
      MAX_WASM_BYTES: 1500000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Install Rust toolchain
        # No args: installs the version, components and targets pinned in
        # rust-toolchain.toml, so CI and local builds use the same compiler
        run: rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-opt
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build web bundle
        run: ./scripts/build-web.sh

      - name: Enforce size budget
        run: |
          # Keep the wasm filename in sync with the [[bin]] name in Cargo.toml
          actual=$(wc -c < dist/web/game-template.wasm)
          echo "wasm size: ${actual} bytes (budget: ${MAX_WASM_BYTES})"
          if [ "${actual}" -gt "${MAX_WASM_BYTES}" ]; then
            echo "::error::wasm payload ${actual} bytes exceeds budget ${MAX_WASM_BYTES}"
            exit 1
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/web

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Attach web bundle to release
        if: github.event_name == 'release'
        run: |
          cd dist/web && zip -r ../game-template-web.zip .

      - name: Upload web bundle to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/game-template-web.zip
          fail_on_unmatched_files: true

  deploy-pages:
    # One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
    # After that, every push to main redeploys.
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-publish:
    needs: lint-and-test
    if: github.event_name == 'release'
    permissions:
      contents: write  # Required for uploading release assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Install native audio dependencies
        # Linux only: quad-alsa-sys needs the libasound .so symlink to link.
        # macOS and Windows get their audio backend from the system SDK.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        # Pinned in rust-toolchain.toml; the matrix target goes on top of it
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          # Keep this in sync with the [[bin]] name in Cargo.toml
          BIN="game-template"
          TARGET="${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/${BIN}-${TARGET}.zip" "./target/${TARGET}/release/${BIN}.exe"
          else
            tar -czf "dist/${BIN}-${TARGET}.tar.gz" -C "target/${TARGET}/release" "${BIN}"
          fi

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
