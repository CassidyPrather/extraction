[workspace]
members = [".", "crates/extraction_core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
authors = ["Cassidy Prather <pratherea@gmail.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/CassidyPrather/extraction"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Deliberately relaxed (see docs/DESIGN.md, "Lints"): default clippy warnings
# only, and the two that fight Bevy's system-parameter style are off.
too_many_arguments = "allow"
type_complexity = "allow"

[package]
name = "extraction"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A VR extraction shooter: scavenge the quarantined Zone, dodge the robots, get out."
readme = "README.md"
publish = false
default-run = "extraction"

[lib]
name = "extraction"
path = "src/lib.rs"

[[bin]]
name = "extraction"
path = "src/main.rs"

[features]
default = ["xr"]
# OpenXR support. The game still runs flat when no XR runtime is present.
xr = ["dep:bevy_mod_openxr", "dep:bevy_mod_xr"]

[dependencies]
extraction_core = { path = "crates/extraction_core" }
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "ui",
    "default_platform",
    "png",
    "jpeg",
    "ktx2",
    "zstd_rust",
    "tonemapping_luts",
    "bevy_gizmos",
    "serialize",
] }
avian3d = "0.7"
bevy_seedling = "0.8"
bevy_mod_openxr = { version = "0.6", optional = true }
bevy_mod_xr = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
fastrand = "2"

[lints]
workspace = true

# Bevy's recommended dev setup: our code stays quick to compile, dependencies
# are optimised so the game is playable in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

# For profiling and the headless map simulations: release speed, quick-ish link.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
